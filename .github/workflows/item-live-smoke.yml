name: Douyin item live smoke

on:
  push:
    branches:
      - codex/douyin-two-video-fix
    paths:
      - app/**
      - scripts/douyin_item_live_smoke.py
      - .github/workflows/item-live-smoke.yml
  workflow_dispatch:
    inputs:
      urls:
        description: Public Douyin item URLs, separated by whitespace
        required: true
        type: string
        default: >-
          https://www.douyin.com/user/self?modal_id=7684132989608949594
          https://www.douyin.com/user/self?modal_id=7677863372330774922
      observe_profile_item_url:
        description: Optional official profile URL with modal_id and vid for anonymous page-route observation
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  download:
    name: Current / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install FFmpeg and Python dependencies
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install ffmpeg
            else
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
          fi
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify production Chrome channel
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            chrome_binary="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          else
            chrome_binary="$(command -v google-chrome || command -v google-chrome-stable || true)"
          fi
          if [[ -z "$chrome_binary" || ! -x "$chrome_binary" ]]; then
            echo "Google Chrome is not available at its standard installation path." >&2
            exit 1
          fi
          "$chrome_binary" --version
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(channel="chrome", headless=True)
              print(f"Production Chrome channel: {browser.version}")
              browser.close()
          PY
      - name: Observe original profile item page without downloading media
        if: ${{ inputs.observe_profile_item_url }}
        continue-on-error: true
        shell: bash
        env:
          OBSERVE_PROFILE_ITEM_URL: ${{ inputs.observe_profile_item_url }}
        run: |
          python scripts/douyin_item_live_smoke.py \
            --observe-profile-item-url "$OBSERVE_PROFILE_ITEM_URL" \
            --report "$RUNNER_TEMP/douyin-profile-observation.json"
      - name: Upload sanitized page observations separately
        if: ${{ always() && inputs.observe_profile_item_url }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: douyin-profile-observation-${{ matrix.os }}
          path: ${{ runner.temp }}/douyin-profile-observation.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run anonymous production discovery and download
        shell: bash
        env:
          INPUT_URLS: ${{ inputs.urls || 'https://www.douyin.com/user/self?modal_id=7684132989608949594 https://www.douyin.com/user/self?modal_id=7677863372330774922' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          command = [sys.executable, "scripts/douyin_item_live_smoke.py",
                     "--report", os.path.join(os.environ["RUNNER_TEMP"], "douyin-item-report.json")]
          for url in os.environ["INPUT_URLS"].split():
              command.extend(["--url", url])
          raise SystemExit(subprocess.call(command))
          PY
      - name: Upload sanitized report only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: douyin-item-live-report-${{ matrix.os }}
          path: ${{ runner.temp }}/douyin-item-report.json
          if-no-files-found: error
          retention-days: 7

  baseline:
    name: Baseline v1.2.19 / ubuntu-24.04 (diagnostic)
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out previous production version
        uses: actions/checkout@v7
        with:
          ref: 2098023f83f05a26a1d4466486e827c8f8641e01
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: baseline/requirements.txt
      - name: Install baseline dependencies and current diagnostic CLI
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -r baseline/requirements.txt
          python -m pip check
          cp scripts/douyin_item_live_smoke.py baseline/scripts/douyin_item_live_smoke.py
      - name: Verify baseline import and production Chrome channel
        working-directory: baseline
        run: |
          google-chrome --version
          python - <<'PY'
          from pathlib import Path
          import app
          from playwright.sync_api import sync_playwright
          assert Path(app.__file__).resolve().parent == Path.cwd() / "app"
          print("Verified that the diagnostic CLI will use the baseline app.")
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(channel="chrome", headless=True)
              print(f"Production Chrome channel: {browser.version}")
              browser.close()
          PY
      - name: Run baseline anonymous production discovery and download
        working-directory: baseline
        env:
          INPUT_URLS: ${{ inputs.urls || 'https://www.douyin.com/user/self?modal_id=7684132989608949594 https://www.douyin.com/user/self?modal_id=7677863372330774922' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          command = [sys.executable, "scripts/douyin_item_live_smoke.py",
                     "--report", os.path.join(os.environ["RUNNER_TEMP"], "douyin-item-baseline-report.json")]
          for url in os.environ["INPUT_URLS"].split():
              command.extend(["--url", url])
          raise SystemExit(subprocess.call(command))
          PY
      - name: Upload sanitized baseline report only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: douyin-item-baseline-report-ubuntu-24.04
          path: ${{ runner.temp }}/douyin-item-baseline-report.json
          if-no-files-found: error
          retention-days: 7
